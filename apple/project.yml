# Source of truth for the Xcode project. Run `xcodegen` in this folder after every change.
# The generated Zimam.xcodeproj and the Info.plist and .entitlements files are not committed:
# Xcode Cloud generates them with ci_scripts/ci_post_clone.sh (docs/release.md).
name: Zimam
options:
  bundleIdPrefix: app.zimam.ios
  developmentLanguage: ar
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The version every bundle carries (app, widgets, watch app, complications): each Info.plist
    # below reads CFBundleShortVersionString and CFBundleVersion from these two, because
    # XcodeGen otherwise writes a fixed "1.0" and "1". Raise MARKETING_VERSION for each release;
    # Xcode Cloud replaces CURRENT_PROJECT_VERSION with its build number (ci_pre_xcodebuild.sh).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer Team ID (Membership details). Set it here, not in Xcode,
    # so it survives regenerating the project.
    DEVELOPMENT_TEAM: 72V86SZ2XC
    CODE_SIGN_STYLE: Automatic
    # The API worker. Becomes https://api.zimam.app once the domain is attached.
    ZIMAM_API_URL: "https://zimam.fahad2ao.workers.dev"
    # Sign in with Google: the iOS OAuth client (it serves the Mac too) and its reversed form,
    # the URL scheme Google returns to. Public values, not secrets. Empty hides the Google button.
    # The API accepts this client in GOOGLE_CLIENT_IDS (api/wrangler.jsonc).
    GOOGLE_IOS_CLIENT_ID: "404741015373-r3p4od9ko0qd99hocpg3r7gv1arju4ge.apps.googleusercontent.com"
    GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.404741015373-r3p4od9ko0qd99hocpg3r7gv1arju4ge"

packages:
  ZimamKit:
    path: ZimamKit
  # Sign in with Google (iOS and macOS), the app target only. 9.x supports a custom nonce.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"

targets:
  Zimam:
    type: application
    supportedDestinations: [iOS, macOS]
    # Each target's folder holds its PrivacyInfo.xcprivacy (copied as a resource): the UserDefaults
    # reasons App Store Connect requires on upload, and for the app the data in the App Privacy
    # label (docs/appstore/privacy-label.md). Keep the two in step.
    sources:
      - path: Zimam
        # StoreKit testing only (the scheme below); not copied into the app.
        excludes: [Resources/Zimam.storekit]
      - path: Zimam/Resources/Zimam.storekit
        buildPhase: none
      # Shared with the widget extension: SwiftData models, Store, the App Group store, intents.
      - path: Shared
      # Shared with the widget extension and the watch app.
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    # A shared "Zimam" scheme whose Run uses the local StoreKit configuration: purchases of
    # «زمام الاحترافية» in the simulator or from Xcode are local (no App Store, no server
    # verification). Untick it in Edit Scheme → Run → Options to test against the sandbox.
    scheme:
      storeKitConfiguration: Zimam/Resources/Zimam.storekit
    dependencies:
      - package: ZimamKit
      - package: GoogleSignIn
        product: GoogleSignIn
      # Embedded in Zimam.app/PlugIns on iPhone, iPad and Mac.
      - target: ZimamWidgets
      # Embedded in Zimam.app/Watch ("Embed Watch Content"), iOS only.
      - target: ZimamWatch
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.ios
        PRODUCT_NAME: Zimam
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # macOS sandbox; Xcode applies these to the Mac build only.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Location for prayer times (adds the sandbox location entitlement on the Mac).
        ENABLE_RESOURCE_ACCESS_LOCATION: YES
        # EventKit on the Mac (Apple Reminders import, Apple Calendar events and import): the sandbox
        # entitlement is the Calendars one, for reminders and events alike.
        ENABLE_RESOURCE_ACCESS_CALENDARS: YES
        # The import file picker (.fileImporter) on the Mac: read-only access to the chosen file.
        ENABLE_USER_SELECTED_FILES: readonly
        # «إملاء» in the add screen on the Mac: the microphone (Zimam/App/SpeechDictation.swift).
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
    info:
      path: Zimam/Resources/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Export compliance: only Apple's own encryption (HTTPS, Keychain, CryptoKit hashing), which
        # is exempt, so App Store Connect does not ask for documents (docs/appstore/listing.md).
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Thmanyah fonts: listed for iOS, and loaded from the Resources folder on macOS.
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ATSApplicationFontsPath: .
        # Prayer times are computed on the device. Only the opt-in «أوقات الصلاة في كلود وChatGPT»
        # (settings) keeps a city-level place (rounded to 0.1°) on the server; the text says so.
        # Location reminders: the system watches the chosen places with when-in-use permission
        # (UNLocationNotificationTrigger), so no «Always» string is needed. The places themselves
        # sync with the reminder; the device's position does not. The Mac has no location triggers,
        # so its text mentions only picking the current location as a place.
        NSLocationWhenInUseUsageDescription: يستعمل زمام موقعك لحساب أوقات الصلاة في مدينتك، ولتذكيرك بمهمة حين تصل إلى مكان اخترته أو تغادره. يبقى موقعك على جهازك؛ ويُحفظ في حسابك المكان الذي تختاره للتذكير، وموقع تقريبي على مستوى المدينة إن فعّلت أوقات الصلاة في كلود وChatGPT.
        NSLocationUsageDescription: يستعمل زمام موقعك لحساب أوقات الصلاة في مدينتك، ولتختار موقعك الحالي مكاناً لتذكير. يبقى موقعك على جهازك؛ ويُحفظ في حسابك المكان الذي تختاره للتذكير، وموقع تقريبي على مستوى المدينة إن فعّلت أوقات الصلاة في كلود وChatGPT.
        # Apple Reminders import (Zimam/Import/RemindersImporter.swift): read only when the user imports.
        NSRemindersFullAccessUsageDescription: يقرأ زمام قوائم التذكيرات التي تختارها حين تطلب استيرادها، فيضيفها مشاريع ومهام في حسابك على زمام. لا يغيّر التذكيرات ولا يحذفها، ولا يقرؤها في غير الاستيراد.
        # Apple Calendar (Zimam/Events, Zimam/Import/CalendarImporter.swift): read only when the user turns
        # on «إظهار أحداث التقويم» or imports. Shown events stay on the device; only what the user converts
        # or imports becomes tasks in the account.
        NSCalendarsFullAccessUsageDescription: يقرأ زمام أحداث التقاويم التي تختارها حين تفعّل «إظهار أحداث التقويم» أو تطلب استيرادها. تبقى الأحداث على جهازك، ولا يُضاف منها إلى حسابك على زمام إلا ما تحوّله إلى مهمة أو تستورده. لا يغيّر زمام التقويم ولا يحذف منه شيئاً.
        # «المهمة الجارية» (Shared/LiveActivity, ZimamWidgets/FocusLiveActivity.swift), iPhone only.
        NSSupportsLiveActivities: true
        # «إملاء» in the add screen (Zimam/App/SpeechDictation.swift): speech to text, on the device
        # when it supports Arabic, otherwise by Apple. The text, not the audio, goes to the assistant.
        NSMicrophoneUsageDescription: يستمع زمام إلى الميكروفون حين تضغط «إملاء» فقط، لتقول المهمة بصوتك بدل كتابتها. يتوقف الاستماع حين تنتهي، ولا يحفظ زمام الصوت.
        NSSpeechRecognitionUsageDescription: يحوّل زمام ما تمليه بصوتك إلى نص في حقل المهمة. يجري التحويل على جهازك إن كان يدعمه، وإلا تحوّله أبل في خوادمها. لا يحفظ زمام الصوت، ويُرسَل النص وحده إلى مساعد زمام ليقرأ موعد المهمة حين تكون متصلاً.
        ZimamAPIURL: $(ZIMAM_API_URL)
        # Sign in with Google reads its client from GIDClientID, and Google's sign-in page
        # returns to the reversed client ID scheme (handled by .onOpenURL in ZimamApp).
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          # «فتح في التطبيق» on the web join page: zimam://join/<code> (App/InviteLinks.swift), and the
          # import OAuth callback zimam://import-callback?pending=<id> (Import/ImportSourceView.swift, ImportLinks.swift).
          - CFBundleURLName: app.zimam.ios.invite
            CFBundleURLSchemes:
              - zimam
    entitlements:
      path: Zimam/Resources/Zimam.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Reminder pushes beyond the local window (api/src/push). Xcode signs archives for
        # TestFlight and the App Store with "production".
        aps-environment: development
        # The local store and the settings the widgets read (see Shared/Model/ZimamStore.swift).
        com.apple.security.application-groups: [group.app.zimam.ios]
        # Google Sign-In keeps its tokens in the Keychain; on the Mac it needs the app's own
        # group listed first (GoogleSignIn-iOS README). On iOS this is already the default group.
        keychain-access-groups: [$(AppIdentifierPrefix)app.zimam.ios]
        # Invite links (https://<site>/join/#<code>) open the app: web/public/.well-known/
        # apple-app-site-association lists 72V86SZ2XC.app.zimam.ios for /join/*. Needs Associated
        # Domains on the App ID (docs/setup.md). Becomes applinks:zimam.app with the domain.
        com.apple.developer.associated-domains: ["applinks:zimam-web.fahad2ao.workers.dev"]

  # Home Screen, Lock Screen and Mac desktop widgets: today's tasks from the shared store,
  # completed in place with CompleteTaskIntent.
  ZimamWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ZimamWidgets
      # The accessory views, shared with the watch complications (iPhone Lock Screen only).
      - path: Glance
      - path: Shared
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.ios.widgets
        PRODUCT_NAME: ZimamWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        # Installed inside the app, so the archive stays an app archive.
        SKIP_INSTALL: YES
        # Mac widgets must be sandboxed.
        ENABLE_APP_SANDBOX: YES
    info:
      path: ZimamWidgets/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ATSApplicationFontsPath: .
    entitlements:
      path: ZimamWidgets/ZimamWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.zimam.ios]

  # The Apple Watch app (single target, watchOS 11). It has no local store: it calls the
  # API with the session the iPhone app sends over WatchConnectivity.
  ZimamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ZimamWatch
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
      # The complications, embedded in the watch app's PlugIns.
      - target: ZimamWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.ios.watchkitapp
        PRODUCT_NAME: ZimamWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: ZimamWatch/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.zimam.ios
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ZimamAPIURL: $(ZIMAM_API_URL)
    # The watch's own App Group: the app writes what the complications show (WatchGlance.swift).
    entitlements:
      path: ZimamWatch/ZimamWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.app.zimam.ios.watch]

  # Apple Watch complications (WidgetKit, watchOS 11): the next task and today's count in the
  # circular, rectangular, inline and corner families. They read the snapshot the watch app
  # saves in group.app.zimam.ios.watch; the views are the iPhone Lock Screen's (Glance/).
  ZimamWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ZimamWatchWidgets
      - path: Glance
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.ios.watchkitapp.widgets
        PRODUCT_NAME: ZimamWatchWidgets
        SKIP_INSTALL: YES
    info:
      path: ZimamWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
    entitlements:
      path: ZimamWatchWidgets/ZimamWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.zimam.ios.watch]
