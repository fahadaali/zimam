# Source of truth for the Xcode project. Run `xcodegen` in this folder after
# every change, and commit the regenerated Zimam.xcodeproj with it.
name: Zimam
options:
  bundleIdPrefix: app.zimam.ios
  developmentLanguage: ar
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer Team ID (Membership details). Set it here, not in Xcode,
    # so it survives regenerating the project.
    DEVELOPMENT_TEAM: 72V86SZ2XC
    CODE_SIGN_STYLE: Automatic
    # The API worker. Becomes https://api.zimam.app once the domain is attached.
    ZIMAM_API_URL: "https://zimam.fahad2ao.workers.dev"
    # Sign in with Google: the iOS OAuth client (it serves the Mac too) and its reversed form,
    # the URL scheme Google returns to. Public values, not secrets. Empty hides the Google button.
    # The API accepts this client in GOOGLE_CLIENT_IDS (api/wrangler.jsonc).
    GOOGLE_IOS_CLIENT_ID: "404741015373-r3p4od9ko0qd99hocpg3r7gv1arju4ge.apps.googleusercontent.com"
    GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.404741015373-r3p4od9ko0qd99hocpg3r7gv1arju4ge"

packages:
  ZimamKit:
    path: ZimamKit
  # Sign in with Google (iOS and macOS), the app target only. 9.x supports a custom nonce.
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.2.0"

targets:
  Zimam:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Zimam
      # Shared with the widget extension: SwiftData models, Store, the App Group store, intents.
      - path: Shared
      # Shared with the widget extension and the watch app.
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
      - package: GoogleSignIn
        product: GoogleSignIn
      # Embedded in Zimam.app/PlugIns on iPhone, iPad and Mac.
      - target: ZimamWidgets
      # Embedded in Zimam.app/Watch ("Embed Watch Content"), iOS only.
      - target: ZimamWatch
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.ios
        PRODUCT_NAME: Zimam
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # macOS sandbox; Xcode applies these to the Mac build only.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Location for prayer times (adds the sandbox location entitlement on the Mac).
        ENABLE_RESOURCE_ACCESS_LOCATION: YES
        # Importing Apple Reminders on the Mac: EventKit's sandbox entitlement is the Calendars one.
        ENABLE_RESOURCE_ACCESS_CALENDARS: YES
        # The import file picker (.fileImporter) on the Mac: read-only access to the chosen file.
        ENABLE_USER_SELECTED_FILES: readonly
    info:
      path: Zimam/Resources/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Thmanyah fonts: listed for iOS, and loaded from the Resources folder on macOS.
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ATSApplicationFontsPath: .
        # Prayer times are computed on the device. Only the opt-in «أوقات الصلاة في كلود وChatGPT»
        # (settings) keeps a city-level place (rounded to 0.1°) on the server; the text says so.
        NSLocationWhenInUseUsageDescription: يستعمل زمام موقعك لحساب أوقات الصلاة في مدينتك، فتصلك المهام والتذكيرات المرتبطة بالصلاة في وقتها. يبقى الموقع على جهازك، إلا إن فعّلت أوقات الصلاة في كلود وChatGPT فيُحفظ في خادم زمام موقع تقريبي على مستوى المدينة.
        NSLocationUsageDescription: يستعمل زمام موقعك لحساب أوقات الصلاة في مدينتك، فتصلك المهام والتذكيرات المرتبطة بالصلاة في وقتها. يبقى الموقع على جهازك، إلا إن فعّلت أوقات الصلاة في كلود وChatGPT فيُحفظ في خادم زمام موقع تقريبي على مستوى المدينة.
        # Apple Reminders import (Zimam/Import/RemindersImporter.swift): read only when the user imports.
        NSRemindersFullAccessUsageDescription: يقرأ زمام قوائم التذكيرات التي تختارها حين تطلب استيرادها، فيضيفها مشاريع ومهام في حسابك على زمام. لا يغيّر التذكيرات ولا يحذفها، ولا يقرؤها في غير الاستيراد.
        ZimamAPIURL: $(ZIMAM_API_URL)
        # Sign in with Google reads its client from GIDClientID, and Google's sign-in page
        # returns to the reversed client ID scheme (handled by .onOpenURL in ZimamApp).
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    entitlements:
      path: Zimam/Resources/Zimam.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Reminder pushes beyond the local window (api/src/push). Xcode signs archives for
        # TestFlight and the App Store with "production".
        aps-environment: development
        # The local store and the settings the widgets read (see Shared/Model/ZimamStore.swift).
        com.apple.security.application-groups: [group.app.zimam.ios]
        # Google Sign-In keeps its tokens in the Keychain; on the Mac it needs the app's own
        # group listed first (GoogleSignIn-iOS README). On iOS this is already the default group.
        keychain-access-groups: [$(AppIdentifierPrefix)app.zimam.ios]

  # Home Screen, Lock Screen and Mac desktop widgets: today's tasks from the shared store,
  # completed in place with CompleteTaskIntent.
  ZimamWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ZimamWidgets
      - path: Shared
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.ios.widgets
        PRODUCT_NAME: ZimamWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        # Installed inside the app, so the archive stays an app archive.
        SKIP_INSTALL: YES
        # Mac widgets must be sandboxed.
        ENABLE_APP_SANDBOX: YES
    info:
      path: ZimamWidgets/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ATSApplicationFontsPath: .
    entitlements:
      path: ZimamWidgets/ZimamWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.zimam.ios]

  # The Apple Watch app (single target, watchOS 11). It has no local store: it calls the
  # API with the session the iPhone app sends over WatchConnectivity.
  ZimamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ZimamWatch
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.ios.watchkitapp
        PRODUCT_NAME: ZimamWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: ZimamWatch/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.zimam.ios
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ZimamAPIURL: $(ZIMAM_API_URL)
