# Source of truth for the Xcode project. Run `xcodegen` in this folder after
# every change, and commit the regenerated Zimam.xcodeproj with it.
name: Zimam
options:
  bundleIdPrefix: app.zimam
  developmentLanguage: ar
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer Team ID (Membership details). Set it here, not in Xcode,
    # so it survives regenerating the project.
    DEVELOPMENT_TEAM: 72V86SZ2XC
    CODE_SIGN_STYLE: Automatic
    # The API worker. Becomes https://api.zimam.app once the domain is attached.
    ZIMAM_API_URL: "https://zimam.fahad2ao.workers.dev"

packages:
  ZimamKit:
    path: ZimamKit

targets:
  Zimam:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Zimam
      # Shared with the widget extension: SwiftData models, Store, the App Group store, intents.
      - path: Shared
      # Shared with the widget extension and the watch app.
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
      # Embedded in Zimam.app/PlugIns on iPhone, iPad and Mac.
      - target: ZimamWidgets
      # Embedded in Zimam.app/Watch ("Embed Watch Content"), iOS only.
      - target: ZimamWatch
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.Zimam
        PRODUCT_NAME: Zimam
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # macOS sandbox; Xcode applies these to the Mac build only.
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # Location for prayer times (adds the sandbox location entitlement on the Mac).
        ENABLE_RESOURCE_ACCESS_LOCATION: YES
    info:
      path: Zimam/Resources/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Thmanyah fonts: listed for iOS, and loaded from the Resources folder on macOS.
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ATSApplicationFontsPath: .
        # Prayer times are computed on the device from the location; it is never sent anywhere.
        NSLocationWhenInUseUsageDescription: يستعمل زمام موقعك لحساب أوقات الصلاة في مدينتك، فتصلك المهام والتذكيرات المرتبطة بالصلاة في وقتها. يبقى الموقع على جهازك ولا يُرسل إلى أي خادم.
        NSLocationUsageDescription: يستعمل زمام موقعك لحساب أوقات الصلاة في مدينتك، فتصلك المهام والتذكيرات المرتبطة بالصلاة في وقتها. يبقى الموقع على جهازك ولا يُرسل إلى أي خادم.
        ZimamAPIURL: $(ZIMAM_API_URL)
    entitlements:
      path: Zimam/Resources/Zimam.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Reminder pushes beyond the local window (api/src/push). Xcode signs archives for
        # TestFlight and the App Store with "production".
        aps-environment: development
        # The local store and the settings the widgets read (see Shared/Model/ZimamStore.swift).
        com.apple.security.application-groups: [group.app.zimam]

  # Home Screen, Lock Screen and Mac desktop widgets: today's tasks from the shared store,
  # completed in place with CompleteTaskIntent.
  ZimamWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ZimamWidgets
      - path: Shared
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.Zimam.widgets
        PRODUCT_NAME: ZimamWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        # Installed inside the app, so the archive stays an app archive.
        SKIP_INSTALL: YES
        # Mac widgets must be sandboxed.
        ENABLE_APP_SANDBOX: YES
    info:
      path: ZimamWidgets/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ATSApplicationFontsPath: .
    entitlements:
      path: ZimamWidgets/ZimamWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.zimam]

  # The Apple Watch app (single target, watchOS 11). It has no local store: it calls the
  # API with the session the iPhone app sends over WatchConnectivity.
  ZimamWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: ZimamWatch
      - path: Common
      - path: ../design/generated/ZimamTokens.swift
      - path: ../design/fonts/apple
        buildPhase: resources
    dependencies:
      - package: ZimamKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zimam.Zimam.watchkitapp
        PRODUCT_NAME: ZimamWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: ZimamWatch/Info.plist
      properties:
        CFBundleDisplayName: زمام
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.zimam.Zimam
        WKRunsIndependentlyOfCompanionApp: false
        UIAppFonts:
          - thmanyahsans-Light.otf
          - thmanyahsans-Regular.otf
          - thmanyahsans-Medium.otf
          - thmanyahsans-Bold.otf
          - thmanyahsans-Black.otf
          - thmanyahserifdisplay-Light.otf
          - thmanyahserifdisplay-Regular.otf
          - thmanyahserifdisplay-Medium.otf
          - thmanyahserifdisplay-Bold.otf
          - thmanyahserifdisplay-Black.otf
        ZimamAPIURL: $(ZIMAM_API_URL)
